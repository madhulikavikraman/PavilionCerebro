[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cascade"
version = "0.1.0"
description = "Imagery-agnostic inspection grading cascade: gate, crop, grade, prioritize, review, export"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.60",
    "pydantic>=2.7",
    "pillow>=10.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "requests>=2.31",
    "huggingface_hub>=0.23",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "scikit-learn>=1.4"]
ui = ["streamlit>=1.36"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cascade = ["rubrics/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
